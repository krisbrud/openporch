[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/drivers",
    "crates/engine",
    "crates/server",
    "crates/client",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/krisbrud/openporch"
publish = false

[workspace.dependencies]
openporch-core = { path = "crates/core" }
openporch-store = { path = "crates/store" }
openporch-drivers = { path = "crates/drivers" }
openporch-engine = { path = "crates/engine" }
openporch-client = { path = "crates/client" }
aes-gcm = "0.10"
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "behavior-version-latest", "sso"] }
aws-credential-types = "1"
aws-sdk-sts = { version = "1.119", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
http-body-util = "0.1"
indexmap = { version = "2", features = ["serde"] }
json-patch = "4"
minijinja = { version = "3", default-features = false, features = ["builtins", "serde", "json", "fuel", "preserve_order", "std_collections"] }
proptest = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
thiserror = "2"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
