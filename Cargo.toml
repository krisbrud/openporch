[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/drivers",
    "crates/engine",
    "crates/server",
    "crates/client",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/krisbrud/openporch"
publish = false

[workspace.dependencies]
openporch-core = { path = "crates/core" }
openporch-store = { path = "crates/store" }
openporch-drivers = { path = "crates/drivers" }
openporch-engine = { path = "crates/engine" }
openporch-client = { path = "crates/client" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
