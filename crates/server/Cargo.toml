[package]
name = "openporch-server"
description = "The openporch HTTP API server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `publish = false` keeps the crate off crates.io; `dist = true` still ships `openporch`
# in GitHub releases. The drivers manage OpenTofu processes with Unix signals, so the
# server is built for Linux and macOS only.
[package.metadata.dist]
dist = true
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = ["shell"]

[[bin]]
name = "openporch"
path = "src/main.rs"

[dependencies]
openporch-core.workspace = true
openporch-store.workspace = true
openporch-drivers.workspace = true
openporch-engine.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
http-body-util.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tower.workspace = true

[lints]
workspace = true
