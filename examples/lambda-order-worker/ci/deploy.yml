# A GitHub Actions workflow that builds the order worker, uploads the zip to
# the platform's artifact bucket under a key that names its content, and
# deploys it. Copy it to .github/workflows/ in the worker's repository.
#
# It needs the repository variables ARTIFACT_BUCKET (the platform's
# `artifact_bucket` output), AWS_REGION, AWS_UPLOAD_ROLE_ARN (a role CI may
# assume through GitHub's OIDC provider, allowed `s3:PutObject` on
# `order-worker/*` in that bucket), OPENPORCH_URL and PORCH_REV (the openporch
# commit whose CLI to install), and the secret OPENPORCH_TOKEN, a service user's
# token with the deployer role in the target environment. Only the Deploy step
# sees the token.
name: Deploy the order worker

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest discover app
      - name: Build
        run: |
          # Fixed timestamps keep the zip, and so its key, the same for the
          # same code.
          mkdir -p build && rm -f build/order-worker.zip
          touch -d @315532800 app/app.py app/secret_refs.py
          (cd app && zip -X -q ../build/order-worker.zip app.py secret_refs.py)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload
        id: upload
        run: |
          key="order-worker/$(sha256sum build/order-worker.zip | cut -c1-64).zip"
          aws s3 cp build/order-worker.zip "s3://${{ vars.ARTIFACT_BUCKET }}/$key"
          echo "uri=s3://${{ vars.ARTIFACT_BUCKET }}/$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/porch
          key: porch-${{ vars.PORCH_REV }}
      - name: Install porch
        run: |
          command -v porch || cargo install --locked \
            --git https://github.com/krisbrud/openporch --rev "${{ vars.PORCH_REV }}" openporch-cli
      - name: Deploy
        # openporch pins the object's current version when it accepts the
        # deployment, so rollbacks and replays run this exact zip.
        run: |
          porch workload deploy -f workload.yaml \
            --artifact "main=${{ steps.upload.outputs.uri }}" \
            --comment "${GITHUB_SHA::12}" --wait
