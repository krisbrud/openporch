# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true
# The platforms openporch ships for. Target-specific dependencies of other platforms,
# such as the wasm32-only `webpki-root-certs`, are out of scope.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml, under serde_yaml_ng, is unmaintained. No vulnerability
    # is reported; revisit when moving to a maintained YAML parser.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no known vulnerability" },
    # The Marvin attack: the `rsa` crate's private-key operations are not
    # constant time. openporch only generates OIDC keys with it; every
    # signature is made by `ring` (crates/engine/src/oidc.rs).
    # SQLite before 3.54 can return uninitialized memory when it opens a
    # database together with a crafted `-wal` file. No sqlx release accepts
    # the fixed libsqlite3-sys (0.39; sqlx-sqlite 0.9 allows <0.38). openporch
    # only opens the database in its own data directory, which anyone able to
    # write already controls the installation; backups are a single file
    # made with `VACUUM INTO`, and restore never brings a `-wal` along.
    # Revisit when sqlx allows libsqlite3-sys 0.39.
    { id = "RUSTSEC-2026-0459", reason = "only the server's own data directory is opened; no sqlx release takes the fix yet" },
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for key generation only; ring signs" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing openporch under Apache-2.0.
# This covers the Rust workspace. The Go module in provider/ also uses HashiCorp's
# MPL-2.0 plugin libraries unmodified; see provider/README.md.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
