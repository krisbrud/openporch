name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: SQLite store tests
        run: cargo test -p openporch-store

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  floci:
    name: account check against Floci
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
        env:
          FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      OPENPORCH_TEST_AWS_ROLE_ARN: arn:aws:iam::000000000000:role/openporch-test
      OPENPORCH_TEST_AWS_EXTERNAL_ID: ext-123
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Create a role that requires an external ID
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:4566/ && break; sleep 1; done
          caller=$(aws sts get-caller-identity --query Arn --output text)
          aws iam create-role --role-name openporch-test --assume-role-policy-document "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [{\"Effect\": \"Allow\", \"Principal\": {\"AWS\": \"$caller\"},
              \"Action\": \"sts:AssumeRole\",
              \"Condition\": {\"StringEquals\": {\"sts:ExternalId\": \"$OPENPORCH_TEST_AWS_EXTERNAL_ID\"}}}]
          }"
      - name: Account check
        run: cargo test -p openporch-engine real_account_check -- --ignored
      - name: Artifact check
        run: |
          aws s3api create-bucket --bucket openporch-artifacts
          aws s3api put-bucket-versioning --bucket openporch-artifacts \
            --versioning-configuration Status=Enabled
          echo worker > worker.zip
          export OPENPORCH_TEST_ARTIFACT_BUCKET=openporch-artifacts
          export OPENPORCH_TEST_ARTIFACT_KEY=order-worker/worker.zip
          export OPENPORCH_TEST_ARTIFACT_VERSION=$(aws s3api put-object \
            --bucket openporch-artifacts --key "$OPENPORCH_TEST_ARTIFACT_KEY" \
            --body worker.zip --query VersionId --output text)
          aws s3api create-bucket --bucket openporch-plain
          aws s3api put-object --bucket openporch-plain --key "$OPENPORCH_TEST_ARTIFACT_KEY" \
            --body worker.zip
          export OPENPORCH_TEST_PLAIN_BUCKET=openporch-plain
          cargo test -p openporch-engine real_artifact_check -- --ignored

  opentofu:
    name: OpenTofu driver
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
    env:
      # The opt-in S3 state test runs against Floci's S3.
      OPENPORCH_TEST_S3_BUCKET: openporch-state
      OPENPORCH_TEST_S3_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Create the state bucket
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:4566/ && break; sleep 1; done
          curl -sf -X PUT http://localhost:4566/openporch-state
      - name: End-to-end OpenTofu runs
        run: cargo test -p openporch-drivers opentofu -- --ignored
      - name: OpenTofu behind the local executor
        run: cargo test -p openporch-engine opentofu -- --ignored
      - name: Example modules against Floci
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: us-east-1
        run: |
          # S3 Control calls go to ACCOUNT.localhost.
          echo "127.0.0.1 000000000000.localhost" | sudo tee -a /etc/hosts
          examples/modules/test.sh

  provider:
    name: OpenTofu provider
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Install toolchain from rust-toolchain.toml
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: Docs are generated from the current schema and examples
        run: |
          scripts/docs.sh
          git diff --exit-code -- docs
          test -z "$(git status --porcelain -- docs)" || { git status --porcelain -- docs; exit 1; }
      - name: Build the server
        working-directory: .
        run: cargo build -p openporch-server --bin openporch
      - name: OpenTofu loads the provider and authenticates
        run: scripts/smoke.sh ../target/debug/openporch
      - name: Acceptance tests
        run: scripts/acceptance.sh ../target/debug/openporch
      - name: Example platform against a dev server and Floci
        working-directory: .
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:4566/ && break; sleep 1; done
          # S3 Control calls go to ACCOUNT.localhost.
          echo "127.0.0.1 000000000000.localhost" | sudo tee -a /etc/hosts
          examples/aws-platform/test.sh target/debug/openporch
